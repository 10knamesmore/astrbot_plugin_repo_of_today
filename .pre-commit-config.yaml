default_install_hook_types: [pre-commit, prepare-commit-msg, pre-push]
ci:
  autofix_commit_msg: ":balloon: auto fixes by pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: main
  autoupdate_schedule: weekly
  autoupdate_commit_msg: ":balloon: pre-commit autoupdate"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.0
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  - repo: local
    hooks:
      - id: pytest
        name: pytest (offline regression tests)
        entry: uv run --group dev pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]
