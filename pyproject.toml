[project]
name = "astrbot_plugin_repo_of_today"
version = "0.3.0"
description = "AstrBot plugin: push GitHub trending and manually tracked repos' commit summaries."
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "aiohttp>=3.9",
  "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
  "ruff>=0.14",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
scripts = [
  "pyyaml",
  "requests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "Q",     # flake8-quotes
  "I",     # import-order
  "UP",    # pyupgrade
]
ignore = [
  "F403",
  "F405",
  "E501",
  "ASYNC230",
  "ASYNC240",
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.10"
reportMissingTypeStubs = false
reportMissingImports = false
